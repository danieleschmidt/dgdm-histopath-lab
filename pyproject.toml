[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dgdm-histopath"
version = "0.2.0"
description = "Dynamic Graph Diffusion Model for histopathology image analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["dgdm_histopath*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
